<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servo Motor Control</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='index.js') }}" defer></script>
</head>

<body>
    <h1>Servo Motor Control</h1>

    <div class="input-group">
        <label for="angle">Enter Angle (0-180):</label>

        <input
            type="number"
            id="angle"
            min="0"
            max="180"
            placeholder=""
        >

        <button type="button" id="setAngle">Set Angle</button>
    </div>
</body>
</html>
